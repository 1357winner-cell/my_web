<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>최동영 | 자기 PR</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f1115;
    color: #e5e5e5;
}

.container {
    width: 90%;
    max-width: 1000px;
    margin: auto;
}

/* ✅ 첫 화면 */
.hero {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-left: 5%;
}

h1 { font-size: 42px; }

h2 {
    margin-top: 60px;
    color: #00d1d1;
    border-left: 4px solid #00d1d1;
    padding-left: 10px;
}

.card {
    background: #1a1d24;
    padding: 20px;
    margin-top: 15px;
    border-radius: 10px;
}

.highlight { color: #00d1d1; }

/* 제품 */
.product-grid {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 20px;
    margin-top: 20px;
}

.product-card {
    background:#1a1d24;
    padding:10px;
    border-radius:10px;
    text-align:center;
}

.product-card img {
    width:100%;
    height:250px;
    object-fit:contain;
    background:#111;
}

.product-title {
    margin-top:10px;
    font-weight:bold;
}

/* ✅ 애니메이션 (초기 상태 완전히 숨김) */
.fade-up {
    opacity: 0;
    transform: translateY(80px);
}

.fade-up.show {
    opacity: 1;
    transform: translateY(0);
    transition: all 0.8s ease;
}

.footer {
    text-align:center;
    margin:60px;
}
</style>
</head>

<body>

<div class="container">

<!-- ✅ 첫 화면 -->
<div class="hero">
    <h1>최동영</h1>
    <p class="highlight">25세 | 창업 준비생</p>
    <p>weron12190@naver.com</p>
</div>

<!-- ✅ 아래부터 숨김 상태 -->
<h2 class="fade-up">ABOUT</h2>
<div class="card fade-up">
먹는 것 → 요리 → 브랜드
</div>

<h2 class="fade-up">CURRENT</h2>
<div class="card fade-up">
한국공학대학교 / 미미당 / 전략 담당
</div>

<h2 class="fade-up">STORY</h2>
<div class="card fade-up">
아이디어 → 실행
</div>

<h2 class="fade-up">BRAND</h2>
<div class="card fade-up">
ME:OK | 시흥의 맛
</div>

<h2 class="fade-up">PRODUCT</h2>

<div class="product-grid">

<div class="product-card fade-up">
    <img src="friedrice.jpg">
    <div class="product-title">볶음밥</div>
</div>

<div class="product-card fade-up">
    <img src="ricebowl.jpg">
    <div class="product-title">덮밥</div>
</div>

<div class="product-card fade-up">
    <img src="chicken.jpg">
    <div class="product-title">닭강정</div>
</div>

<div class="product-card fade-up">
    <img src="ade.jpg">
    <div class="product-title">에이드</div>
</div>

</div>

<h2 class="fade-up">FUTURE</h2>
<div class="card fade-up">
팝업 → 매장
</div>

<div class="footer fade-up">
© 2026 CHOI DONG YOUNG
</div>

</div>

<script>
const elements = document.querySelectorAll('.fade-up');

/* ✅ 핵심: threshold 크게 */
const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
        if (entry.intersectionRatio > 0.3) {
            entry.target.classList.add('show');
        } else {
            entry.target.classList.remove('show');
        }
    });
}, {
    threshold: 0.3
});

elements.forEach(el => observer.observe(el));
</script>

</body>
</html>
``
