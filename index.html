<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>최동영 | 자기 PR</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f1115;
    color: #e5e5e5;
}

.container {
    width: 90%;
    max-width: 1000px;
    margin: auto;
}

/* ✅ 첫 화면 */
.hero {
    height: 90vh; /* ⭐ 너무 벌어지지 않게 */
    display: flex;
    flex-direction: column;
    justify-content: center;
}

/* 타이틀 */
h1 { font-size: 42px; }

h2 {
    margin-top: 100px;
    font-size: 28px;
    color: #00d1d1;
    border-left: 5px solid #00d1d1;
    padding-left: 12px;
}

/* 카드 */
.card {
    background: #1a1d24;
    padding: 25px;
    margin-top: 20px;
    border-radius: 12px;
}

/* 제품 */
.product-grid {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 40px;
    margin-top: 40px;
}

.product-card {
    background:#1a1d24;
    padding:15px;
    border-radius:12px;
    text-align:center;
}

.product-card img {
    width:100%;
    height:260px;
    object-fit:contain;
    background:#111;
}

.product-title {
    margin-top:10px;
    font-weight:bold;
}

/* ✅ 애니메이션 */
.fade-up {
    opacity: 0;
    transform: translateY(120px);
}

/* 등장 */
.fade-up.show {
    opacity: 1;
    transform: translateY(0);
    transition: all 0.9s ease;
}

.footer {
    text-align:center;
    margin:120px 0;
}

.highlight { color:#00d1d1; }
</style>
</head>

<body>

<div class="container">

<!-- ✅ 첫 화면 -->
<div class="hero">
    <h1>최동영</h1>
    <p class="highlight">25세 | 창업 준비생</p>
    <p>weron12190@naver.com</p>
</div>

<!-- ✅ 콘텐츠 -->

<h2 class="fade-up">ABOUT</h2>
<div class="card fade-up">
먹는 것을 좋아하는 사람 →
<span class="highlight">요리하는 사람</span> →
<span class="highlight">브랜드를 만드는 사람</span>
</div>

<h2 class="fade-up">CURRENT</h2>
<div class="card fade-up">
한국공학대학교 경영학부<br>
미미당 활동<br>
제품기획 · 전략 담당
</div>

<h2 class="fade-up">STORY</h2>
<div class="card fade-up">
아이디어 → 실행 → 창업
</div>

<h2 class="fade-up">BRAND</h2>
<div class="card fade-up">
ME:OK | 시흥의 맛
</div>

<h2 class="fade-up">PRODUCT</h2>

<div class="product-grid">

<div class="product-card fade-up">
    <img src="friedrice.jpg">
    <div class="product-title">미나리 삼겹살 볶음밥</div>
</div>

<div class="product-card fade-up">
    <img src="ricebowl.jpg">
    <div class="product-title">미나리 삼겹 덮밥</div>
</div>

<div class="product-card fade-up">
    <img src="chicken.jpg">
    <div class="product-title">미나리 햇토미 닭강정</div>
</div>

<div class="product-card fade-up">
    <img src="ade.jpg">
    <div class="product-title">미나리 사과 에이드</div>
</div>

</div>

<h2 class="fade-up">FUTURE</h2>
<div class="card fade-up">
팝업 → 매장
</div>

<div class="footer fade-up">
© 2026 CHOI DONG YOUNG
</div>

</div>

<script>
const elements = document.querySelectorAll('.fade-up');

const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if (entry.isIntersecting && entry.intersectionRatio > 0.5) {
            entry.target.classList.add('show');
        } else {
            entry.target.classList.remove('show');
        }
    });
}, {
    threshold: 0.5,  // ✅ 절반 이상 보여야 등장
    rootMargin: "0px 0px -10% 0px"  // ✅ 너무 빨리 반응 방지
});

elements.forEach(el => observer.observe(el));
</script>

</body>
</html>
